name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build · typecheck · lint · doc-drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for doc-drift diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Doc-drift check (.docmeta.yml)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          pnpm run check:docs

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint / format
        run: pnpm run lint

      - name: Build
        run: pnpm run build

  ai:
    name: ai · ruff · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --frozen

      - name: Lint / format
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

  # Does this change touch anything the retrieval eval measures?
  #
  # The eval spends a metered, rate-limited rerank quota, so running it on every
  # push is not merely slow, it is the thing that exhausts the quota. A
  # README-only pull request burned ~81 rerank calls and then failed on the limit
  # it had just spent. Nothing about that run could have detected a retrieval
  # regression, because nothing in it could have caused one.
  #
  # Plain git rather than a filter action: one `diff --name-only` against the
  # base is the whole requirement, and a dependency is a maintenance liability
  # (AGENTS.md rule 20).
  eval-scope:
    name: ai · eval scope
    runs-on: ubuntu-latest
    outputs:
      retrieval: ${{ steps.check.outputs.retrieval }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A first push to a branch reports an all-zero "before" SHA, and a
          # force-push can leave one unreachable. Either way the safe answer is
          # to run the eval: skipping on an unknown diff would silently drop the
          # gate exactly when history is unusual.
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "base commit unavailable; running the eval rather than assuming it is unnecessary"
            echo "retrieval=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(services/ai/|\.github/workflows/ci\.yml$)'; then
            echo "retrieval=true" >> "$GITHUB_OUTPUT"
          else
            echo "retrieval=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Retrieval eval skipped::No changes under services/ai/, so retrieval cannot have regressed. The gate is scope-limited, not disabled."
          fi

  # Retrieval eval against the golden set. Runs the real pipeline (embed, hybrid
  # search, rerank) over services/ai/eval/golden.json and fails on a regression.
  #
  # It CANNOT gate until the repository has credentials: retrieval needs the
  # Supabase corpus and a rerank key, and the `ai` job above deliberately runs
  # without either. Until then this job reports that it is unarmed rather than
  # passing silently, because a green check that measured nothing is worse than a
  # visibly missing one.
  #
  # To arm it, add SUPABASE_URL, SUPABASE_SECRET_KEY, OPENAI_API_KEY and
  # COHERE_API_KEY as repository secrets. Note a Cohere trial key allows 10 calls
  # a minute, which the golden set exceeds many times over; COHERE_RERANK_RPM
  # holds the run under that ceiling, and should be removed on a production key.
  eval:
    name: ai · retrieval eval (golden set)
    runs-on: ubuntu-latest
    # ~10 minutes of that is the rate limiter holding, so the default 6h timeout
    # would let a limiter bug idle for hours before anyone noticed.
    timeout-minutes: 30
    needs: eval-scope
    if: needs.eval-scope.outputs.retrieval == 'true'
    # The rerank quota belongs to the KEY, not to the branch, so the concurrency
    # group must not be scoped by ref the way the workflow-level one is. Two runs
    # racing is exactly how this broke: a pull-request run started while its own
    # merge-to-main run was still going, and was rejected on its first call
    # against a quota the other run had already spent.
    #
    # cancel-in-progress is false on purpose. Queueing costs wall-clock;
    # cancelling would throw away a half-finished measurement to start another
    # that competes for the same quota.
    concurrency:
      group: cohere-rerank-quota
      cancel-in-progress: false
    defaults:
      run:
        working-directory: services/ai
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      # A Cohere trial key allows 10 calls/minute. 8 leaves headroom for the
      # retry path and for anything else touching the key while CI runs.
      #
      # This replaces the old EVAL_CASE_DELAY_S pacing, which was calibrated when
      # one case meant one rerank call. Query decomposition made a positive case
      # cost one call for the goal plus one per sub-query, up to seven, so
      # per-case pauses could not express the quota and the run failed on it.
      #
      # Budget honestly: 15 cases, 11 of them positive, is up to ~81 rerank calls,
      # so this job takes ~10 minutes and is CAPPED BY THE TRIAL KEY, not by the
      # work. Remove this line on a production key and it finishes in seconds.
      COHERE_RERANK_RPM: '8'
      # MUST match how the corpus was embedded. The corpus is on bge-m3
      # (ADR-0008); leaving this at the `openai` default would embed queries in a
      # different vector space from the stored vectors and score near-zero, which
      # reads as a retrieval regression rather than as a misconfigured job.
      EMBED_PROVIDER: local
      EMBED_LOCAL_MODEL: BAAI/bge-m3
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # ~2.2GB of weights. Cached on the lockfile so it is fetched once rather
      # than on every run.
      - name: Cache bge-m3 weights
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf
          key: hf-bge-m3-${{ hashFiles('services/ai/uv.lock') }}

      - name: Install
        run: uv sync --extra dev --extra local-embed --frozen

      - name: Run retrieval eval
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$COHERE_API_KEY" ]; then
            echo "::warning title=Eval gate unarmed::No credentials configured, so retrieval was NOT evaluated. This job is not gating anything. See .github/workflows/ci.yml."
            exit 0
          fi
          uv run python -m octopus_ai.evaluation
