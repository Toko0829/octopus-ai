name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build · typecheck · lint · doc-drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for doc-drift diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Doc-drift check (.docmeta.yml)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          pnpm run check:docs

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint / format
        run: pnpm run lint

      - name: Build
        run: pnpm run build

  ai:
    name: ai · ruff · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --frozen

      - name: Lint / format
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

  # Retrieval eval against the golden set. Runs the real pipeline (embed, hybrid
  # search, rerank) over services/ai/eval/golden.json and fails on a regression.
  #
  # It CANNOT gate until the repository has credentials: retrieval needs the
  # Supabase corpus and a rerank key, and the `ai` job above deliberately runs
  # without either. Until then this job reports that it is unarmed rather than
  # passing silently, because a green check that measured nothing is worse than a
  # visibly missing one.
  #
  # To arm it, add SUPABASE_URL, SUPABASE_SECRET_KEY, OPENAI_API_KEY and
  # COHERE_API_KEY as repository secrets. Note a Cohere trial key allows 10 calls
  # a minute, which the set exceeds; EVAL_CASE_DELAY_S paces it, and can drop to 0
  # on a production key.
  eval:
    name: ai · retrieval eval (golden set)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      EVAL_CASE_DELAY_S: '7'
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --frozen

      - name: Run retrieval eval
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$COHERE_API_KEY" ]; then
            echo "::warning title=Eval gate unarmed::No credentials configured, so retrieval was NOT evaluated. This job is not gating anything. See .github/workflows/ci.yml."
            exit 0
          fi
          uv run python -m octopus_ai.evaluation
