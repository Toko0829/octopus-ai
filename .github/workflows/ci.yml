name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build · typecheck · lint · doc-drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for doc-drift diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Doc-drift check (.docmeta.yml)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          pnpm run check:docs

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint / format
        run: pnpm run lint

      - name: Build
        run: pnpm run build

  ai:
    name: ai · ruff · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --frozen

      - name: Lint / format
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      # The Ragas/DeepEval eval gate (rag.md thresholds) is added with RAG, in the
      # same PR as the golden set. There is nothing to evaluate before then.
