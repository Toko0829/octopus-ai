name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build · typecheck · lint · doc-drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for doc-drift diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Doc-drift check (.docmeta.yml)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          pnpm run check:docs

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint / format
        run: pnpm run lint

      # The first Node-side tests in the repo. `services/ai` has had pytest since
      # it existed; the TypeScript half had nothing, which was recorded in the
      # README as a gap rather than a decision. `packages/core` is what made it
      # untenable: it decides whether a task runs unsupervised, and "read it
      # carefully" is not a control.
      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  ai:
    name: ai · ruff · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --frozen

      - name: Lint / format
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

  # Does this change touch anything the retrieval eval measures?
  #
  # The eval spends a metered, rate-limited rerank quota, so running it on every
  # push is not merely slow, it is the thing that exhausts the quota. A
  # README-only pull request burned ~81 rerank calls and then failed on the limit
  # it had just spent. Nothing about that run could have detected a retrieval
  # regression, because nothing in it could have caused one.
  #
  # Plain git rather than a filter action: one `diff --name-only` against the
  # base is the whole requirement, and a dependency is a maintenance liability
  # (AGENTS.md rule 20).
  eval-scope:
    name: ai · eval scope
    runs-on: ubuntu-latest
    outputs:
      retrieval: ${{ steps.check.outputs.retrieval }}
      armed: ${{ steps.check.outputs.armed }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Credentials are checked HERE rather than inside the eval, because the
          # eval is now several jobs. An unarmed shard that exits 0 without
          # writing results would make the merge step fail on missing cases,
          # turning "not configured" into a red gate.
          if [ -z "$SUPABASE_URL" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "retrieval=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Eval gate unarmed::No credentials configured, so retrieval was NOT evaluated. This job is not gating anything. See .github/workflows/ci.yml."
            exit 0
          fi
          echo "armed=true" >> "$GITHUB_OUTPUT"

          # A first push to a branch reports an all-zero "before" SHA, and a
          # force-push can leave one unreachable. Either way the safe answer is
          # to run the eval: skipping on an unknown diff would silently drop the
          # gate exactly when history is unusual.
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "base commit unavailable; running the eval rather than assuming it is unnecessary"
            echo "retrieval=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")
          echo "$CHANGED"

          # Only the files that can actually move a retrieval number. The
          # previous filter was all of `services/ai/**`, which meant a change to
          # `main.py`, `schemas.py` or `plan.py` spent tens of minutes of CPU
          # proving something it could not have affected.
          #
          # Erring toward running, deliberately, and wider than the obvious list:
          #   providers.py     holds the rerank adapter
          #   config.py        holds the threshold and candidate depth
          #   db.py            issues hybrid_search
          #   pyproject/uv.lock a torch or transformers bump moves model scores
          #   supabase/migrations  hybrid_search and the RAG schema ARE retrieval
          #   runtime.py       sets the thread budget the eval itself runs under,
          #                    and divides it by RERANK_FANOUT
          #   bench.py         is what chooses the fan-out and batch size the
          #                    eval then measures with
          # When in doubt add the path rather than leave the gate blind to it.
          if echo "$CHANGED" | grep -qE '^(services/ai/(corpus/|eval/|pyproject\.toml$|uv\.lock$|src/octopus_ai/(retrieval|decompose|providers|config|db|ingestion|local_embedder|local_reranker|runtime|bench|evaluation)\.py)|supabase/migrations/|\.github/workflows/ci\.yml$)'; then
            echo "retrieval=true" >> "$GITHUB_OUTPUT"
          else
            echo "retrieval=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Retrieval eval skipped::No retrieval-affecting files changed, so retrieval cannot have regressed. The gate is scope-limited, not disabled. See the path list in .github/workflows/ci.yml."
          fi

  # Retrieval eval against the golden set. Runs the real pipeline (embed, hybrid
  # search, rerank) over services/ai/eval/golden.json and fails on a regression.
  #
  # It CANNOT gate until the repository has credentials: retrieval needs the
  # Supabase corpus, and the `ai` job above deliberately runs without any. Until
  # then this job reports that it is unarmed rather than passing silently,
  # because a green check that measured nothing is worse than a visibly missing
  # one.
  #
  # To arm it, add SUPABASE_URL, SUPABASE_SECRET_KEY and OPENAI_API_KEY as
  # repository secrets. OpenAI is still needed for query decomposition and
  # generation; a rerank key is NOT, since reranking now runs in-process
  # (ADR-0009).
  #
  # **Sharded across runners, and that is the only reason it is safe to be.** The
  # work is CPU-bound, so more runners buy more cores. A shard therefore writes
  # RAW PER-CASE RESULTS and never a verdict: recall over three cases is a
  # different statistic from recall over fifteen, and 0.80 of three is not 0.80
  # of the set. The `eval-report` job below applies the thresholds exactly once,
  # over the merged whole, and refuses to report at all unless every golden case
  # is present.
  #
  # That refusal is the point. The dangerous failure is not a shard that errors,
  # it is a shard that never reports: the denominator would shrink and a green
  # check would be returned over a set nobody measured in full.
  #
  # **Five, and the number was measured rather than picked.** At three, wall
  # clock was 10.8 minutes and the shards finished at 5.2 / 10.0 / 10.4. The
  # obvious reading was an uneven split, and it was wrong: the per-shard call
  # counts were 16 / 15 / 13, near enough even, while per-call time differed
  # two-fold (31.7s against 15.7s). That is runner-hardware variance, which
  # redistributing cases cannot fix and more shards can, by making any one slow
  # runner own less of the set.
  #
  # Diminishing after that: setup is ~90s per shard and fixed, so it becomes the
  # floor. Five puts the expected worst shard near 5 minutes of eval on top of
  # that. Going much higher spends runners to shave seconds.
  eval:
    name: ai · eval shard ${{ matrix.shard }}/5
    runs-on: ubuntu-latest
    # The reranker is a CPU cross-encoder on a small runner, so this is minutes
    # of real compute rather than a rate limiter holding. Bounded so a pathology
    # (an unbatched loop, a model that failed to cache) surfaces as a timeout
    # instead of burning an hour of runner time.
    # Measured 2026-08-28, on the 35-case set over the grown corpus: the two
    # shards that finished took 13m54s and 19m14s, and the previous bound of 20
    # killed the other three at exactly 20m16s each. The old "~5 minutes of
    # eval" number predates the corpus growth and `measurement` joining
    # COVERED_STAGES, which gives every broad goal a sixth sub-query and every
    # sub-query is another cross-encoder pass (rag-knowledge.md records the
    # same slowdown arriving locally). 40 fits the measured worst shard with
    # the same 2x headroom the old bound intended, while still cutting off a
    # genuine hang well short of an hour.
    timeout-minutes: 40
    needs: eval-scope
    if: needs.eval-scope.outputs.retrieval == 'true'
    strategy:
      # One failing shard must not cancel the others. The merge step needs every
      # shard's results to say anything at all, and a partial set is refused
      # rather than scored, so losing the survivors buys nothing but confusion.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: services/ai
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Decomposition and generation only. There is no rerank credential any more.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # MUST match how the corpus was embedded. The corpus is on bge-m3
      # (ADR-0008); leaving this at the `openai` default would embed queries in a
      # different vector space from the stored vectors and score near-zero, which
      # reads as a retrieval regression rather than as a misconfigured job.
      EMBED_PROVIDER: local
      EMBED_LOCAL_MODEL: BAAI/bge-m3
      # The gate must run the production reranker (ADR-0009). Pointing this at
      # Cohere while production runs bge would measure a pipeline nobody runs,
      # which is the mistake this eval has already had to correct once.
      RERANK_PROVIDER: local
      RERANK_LOCAL_MODEL: BAAI/bge-reranker-v2-m3
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # ~4.6GB of weights across the embedder and the reranker. Cached together
      # so they are fetched once rather than on every run. The key names both
      # models: changing either must invalidate the cache, or the job silently
      # keeps scoring with the previous one.
      - name: Cache model weights (bge-m3 + bge-reranker-v2-m3)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf
          key: hf-${{ env.EMBED_LOCAL_MODEL }}-${{ env.RERANK_LOCAL_MODEL }}-${{ hashFiles('services/ai/uv.lock') }}

      - name: Install
        run: uv sync --extra dev --extra local-embed --frozen

      - name: Fetch model weights if not cached
        run: |
          uv run python - <<'PY'
          from huggingface_hub import snapshot_download
          for repo in ("BAAI/bge-m3", "BAAI/bge-reranker-v2-m3"):
              # The repos ship a full ONNX duplicate of the weights that nothing
              # here loads; excluding it roughly halves each download.
              print(repo, snapshot_download(repo, ignore_patterns=["onnx/*", "*.onnx"]))
          PY

      # No credential guard here: `eval-scope` already refused to arm the gate
      # without secrets, so reaching this step means they exist. Guarding again
      # would let a shard exit 0 having written nothing, which the merge step
      # would then report as a missing case rather than as "not configured".
      - name: Run eval shard
        run: uv run python -m octopus_ai.evaluation --shard ${{ matrix.shard }}/5 --out shard-${{ matrix.shard }}.json

      - name: Upload shard results
        uses: actions/upload-artifact@v4
        with:
          name: eval-shard-${{ matrix.shard }}
          path: services/ai/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  # Applies the thresholds, once, over the whole set. This is the job whose
  # red/green actually means something; the shards only gather evidence.
  eval-report:
    name: ai · retrieval eval (golden set)
    runs-on: ubuntu-latest
    needs: [eval-scope, eval]
    # `always()` so a failed or cancelled shard still reaches the merge, which
    # then refuses on missing cases and says exactly which ones. Without it the
    # gate would simply be skipped when a shard died, which reads as "fine".
    if: always() && needs.eval-scope.outputs.retrieval == 'true'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # No models and no credentials: merging is arithmetic over JSON. Skipping
      # the local-embed extra keeps this job at seconds rather than minutes.
      - name: Install
        run: uv sync --extra dev --frozen

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: eval-shard-*
          path: services/ai/shards
          merge-multiple: true

      - name: Merge shards and apply the gate
        run: |
          ls -l shards/ || true
          uv run python -m octopus_ai.evaluation --merge shards/*.json

  # The reasoning core's container (services/ai/Dockerfile).
  #
  # Built on any PR that touches its inputs so a broken Dockerfile is caught
  # here rather than at deploy time, and published to GHCR from `main` so Fly.io
  # has something to pull. `infra-devops.md` carries the measured numbers: 6.44GB
  # of layers, 5.15GB peak RSS with both models resident, ~17s to a warm /health.
  #
  # **The eval shards deliberately do NOT run inside this image, and that is a
  # measurement rather than an oversight.** Rerouting them was the original
  # motivation: setup is ~90s per shard and five shards make it the floor that
  # stopped further splitting from helping. But most of that 90s was `uv sync`
  # pulling the CUDA torch stack, and pinning CPU torch in `uv.lock` already
  # removed 2,480MB of the 3,179MB of Linux wheels from every install including
  # this one. What remains is restoring ~4.6GB of weights from the Actions cache,
  # and a registry pull of an image containing those same weights moves the same
  # bytes. That trade might win and might not; claiming it without measuring
  # would be exactly the kind of unmeasured "obvious fix" the three-shard split
  # already taught this workflow to distrust. Revisit with numbers, not a hunch.
  ai-image:
    name: ai · container build
    runs-on: ubuntu-latest
    # A cold build downloads ~4.6GB of weights and installs torch. Warm, the
    # registry cache makes it minutes. Bounded so a pathology is a timeout
    # rather than an hour of runner time.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (full history for the input diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GHCR rejects an uppercase path, and `github.repository_owner` preserves
      # the account's casing. Lowercased once here rather than at three use
      # sites, where one of them would eventually be missed.
      - name: Resolve image reference
        id: ref
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$OWNER/octopus-ai" >> "$GITHUB_OUTPUT"

      # Same shape as `eval-scope`, and wider than it looks it needs to be. The
      # image bakes src, corpus and eval as well as the dependency and weight
      # layers, so a source-only change still produces a different image. Those
      # rebuild only the final COPY layers against a warm cache, which is cheap;
      # skipping them would ship a container whose code does not match the commit
      # that published it, which is not.
      - name: Decide whether the image needs building
        id: scope
        run: |
          BASE_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

          # `main` always builds: it is what gets published, so it must be built
          # from the commit it claims to be.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # An unknown base means an unusual history, and the safe answer is to
          # build rather than to assume nothing changed.
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "base commit unavailable; building rather than assuming it is unnecessary"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")
          if echo "$CHANGED" | grep -qE '^(services/ai/|\.github/workflows/ci\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Container build skipped::Nothing under services/ai changed, so the image cannot have."
          fi

      - name: Set up Buildx
        if: steps.scope.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      # Logged in on pull_request too, not only on push: the layer cache lives in
      # the registry rather than in the Actions cache, because the weights layer
      # alone is 4.6GB against a 10GB per-repository cache limit that the uv and
      # HF caches already share.
      - name: Log in to GHCR
        if: steps.scope.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `context: services/ai` rather than the repo root, matching the Dockerfile
      # and DEVELOPMENT.md: the service is outside the pnpm workspace (ADR-0006)
      # and a root context would send node_modules to the daemon.
      #
      # Pushed only from `main`. A PR proves the image builds; it does not get to
      # publish an artifact something might deploy.
      - name: Build (and publish from main)
        if: steps.scope.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: services/ai
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.ref.outputs.image }}:${{ github.sha }}
            ${{ steps.ref.outputs.image }}:latest
          cache-from: type=registry,ref=${{ steps.ref.outputs.image }}:buildcache
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}:buildcache,mode=max', steps.ref.outputs.image) || '' }}

      # Proves the thing that a Dockerfile review cannot: that a process which
      # overrides CMD still inherits the model paths. The first version of this
      # image resolved them in the CMD's shell, so `docker run <image> python -m
      # octopus_ai.evaluation` saw an empty path and failed with a repo-id error.
      # Cheap, offline, and it needs no credentials.
      - name: Smoke test the built image
        if: steps.scope.outputs.build == 'true' && github.event_name == 'push'
        run: |
          docker run --rm "${{ steps.ref.outputs.image }}:${{ github.sha }}" python -c "
          import os
          for k in ('EMBED_LOCAL_PATH', 'RERANK_LOCAL_PATH', 'HF_HUB_OFFLINE'):
              assert os.environ.get(k), f'{k} is not set in the image'
              print(k, '=', os.environ[k])
          assert os.path.isdir(os.environ['EMBED_LOCAL_PATH']), 'embedder weights missing'
          assert os.path.isdir(os.environ['RERANK_LOCAL_PATH']), 'reranker weights missing'
          from octopus_ai.evaluation import main
          print('eval harness importable:', callable(main))
          "
