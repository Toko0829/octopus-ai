name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build · typecheck · lint · doc-drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for doc-drift diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Doc-drift check (.docmeta.yml)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          pnpm run check:docs

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint / format
        run: pnpm run lint

      - name: Build
        run: pnpm run build

  ai:
    name: ai · ruff · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --frozen

      - name: Lint / format
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

  # Does this change touch anything the retrieval eval measures?
  #
  # The eval spends a metered, rate-limited rerank quota, so running it on every
  # push is not merely slow, it is the thing that exhausts the quota. A
  # README-only pull request burned ~81 rerank calls and then failed on the limit
  # it had just spent. Nothing about that run could have detected a retrieval
  # regression, because nothing in it could have caused one.
  #
  # Plain git rather than a filter action: one `diff --name-only` against the
  # base is the whole requirement, and a dependency is a maintenance liability
  # (AGENTS.md rule 20).
  eval-scope:
    name: ai · eval scope
    runs-on: ubuntu-latest
    outputs:
      retrieval: ${{ steps.check.outputs.retrieval }}
      armed: ${{ steps.check.outputs.armed }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Credentials are checked HERE rather than inside the eval, because the
          # eval is now several jobs. An unarmed shard that exits 0 without
          # writing results would make the merge step fail on missing cases,
          # turning "not configured" into a red gate.
          if [ -z "$SUPABASE_URL" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "retrieval=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Eval gate unarmed::No credentials configured, so retrieval was NOT evaluated. This job is not gating anything. See .github/workflows/ci.yml."
            exit 0
          fi
          echo "armed=true" >> "$GITHUB_OUTPUT"

          # A first push to a branch reports an all-zero "before" SHA, and a
          # force-push can leave one unreachable. Either way the safe answer is
          # to run the eval: skipping on an unknown diff would silently drop the
          # gate exactly when history is unusual.
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "base commit unavailable; running the eval rather than assuming it is unnecessary"
            echo "retrieval=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")
          echo "$CHANGED"

          # Only the files that can actually move a retrieval number. The
          # previous filter was all of `services/ai/**`, which meant a change to
          # `main.py`, `schemas.py` or `plan.py` spent tens of minutes of CPU
          # proving something it could not have affected.
          #
          # Erring toward running, deliberately, and wider than the obvious list:
          #   providers.py     holds the rerank adapter
          #   config.py        holds the threshold and candidate depth
          #   db.py            issues hybrid_search
          #   pyproject/uv.lock a torch or transformers bump moves model scores
          #   supabase/migrations  hybrid_search and the RAG schema ARE retrieval
          # When in doubt add the path rather than leave the gate blind to it.
          if echo "$CHANGED" | grep -qE '^(services/ai/(corpus/|eval/|pyproject\.toml$|uv\.lock$|src/octopus_ai/(retrieval|decompose|providers|config|db|ingestion|local_embedder|local_reranker|evaluation)\.py)|supabase/migrations/|\.github/workflows/ci\.yml$)'; then
            echo "retrieval=true" >> "$GITHUB_OUTPUT"
          else
            echo "retrieval=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Retrieval eval skipped::No retrieval-affecting files changed, so retrieval cannot have regressed. The gate is scope-limited, not disabled. See the path list in .github/workflows/ci.yml."
          fi

  # Retrieval eval against the golden set. Runs the real pipeline (embed, hybrid
  # search, rerank) over services/ai/eval/golden.json and fails on a regression.
  #
  # It CANNOT gate until the repository has credentials: retrieval needs the
  # Supabase corpus, and the `ai` job above deliberately runs without any. Until
  # then this job reports that it is unarmed rather than passing silently,
  # because a green check that measured nothing is worse than a visibly missing
  # one.
  #
  # To arm it, add SUPABASE_URL, SUPABASE_SECRET_KEY and OPENAI_API_KEY as
  # repository secrets. OpenAI is still needed for query decomposition and
  # generation; a rerank key is NOT, since reranking now runs in-process
  # (ADR-0009).
  #
  # **Sharded across runners, and that is the only reason it is safe to be.** The
  # work is CPU-bound, so more runners buy more cores. A shard therefore writes
  # RAW PER-CASE RESULTS and never a verdict: recall over three cases is a
  # different statistic from recall over fifteen, and 0.80 of three is not 0.80
  # of the set. The `eval-report` job below applies the thresholds exactly once,
  # over the merged whole, and refuses to report at all unless every golden case
  # is present.
  #
  # That refusal is the point. The dangerous failure is not a shard that errors,
  # it is a shard that never reports: the denominator would shrink and a green
  # check would be returned over a set nobody measured in full.
  #
  # **Five, and the number was measured rather than picked.** At three, wall
  # clock was 10.8 minutes and the shards finished at 5.2 / 10.0 / 10.4. The
  # obvious reading was an uneven split, and it was wrong: the per-shard call
  # counts were 16 / 15 / 13, near enough even, while per-call time differed
  # two-fold (31.7s against 15.7s). That is runner-hardware variance, which
  # redistributing cases cannot fix and more shards can, by making any one slow
  # runner own less of the set.
  #
  # Diminishing after that: setup is ~90s per shard and fixed, so it becomes the
  # floor. Five puts the expected worst shard near 5 minutes of eval on top of
  # that. Going much higher spends runners to shave seconds.
  eval:
    name: ai · eval shard ${{ matrix.shard }}/5
    runs-on: ubuntu-latest
    # The reranker is a CPU cross-encoder on a small runner, so this is minutes
    # of real compute rather than a rate limiter holding. Bounded so a pathology
    # (an unbatched loop, a model that failed to cache) surfaces as a timeout
    # instead of burning an hour of runner time.
    # A shard is ~5 minutes of eval plus ~90s of setup. 20 leaves room for a
    # slow runner without letting a hang burn three quarters of an hour.
    timeout-minutes: 20
    needs: eval-scope
    if: needs.eval-scope.outputs.retrieval == 'true'
    strategy:
      # One failing shard must not cancel the others. The merge step needs every
      # shard's results to say anything at all, and a partial set is refused
      # rather than scored, so losing the survivors buys nothing but confusion.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: services/ai
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Decomposition and generation only. There is no rerank credential any more.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # MUST match how the corpus was embedded. The corpus is on bge-m3
      # (ADR-0008); leaving this at the `openai` default would embed queries in a
      # different vector space from the stored vectors and score near-zero, which
      # reads as a retrieval regression rather than as a misconfigured job.
      EMBED_PROVIDER: local
      EMBED_LOCAL_MODEL: BAAI/bge-m3
      # The gate must run the production reranker (ADR-0009). Pointing this at
      # Cohere while production runs bge would measure a pipeline nobody runs,
      # which is the mistake this eval has already had to correct once.
      RERANK_PROVIDER: local
      RERANK_LOCAL_MODEL: BAAI/bge-reranker-v2-m3
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # ~4.6GB of weights across the embedder and the reranker. Cached together
      # so they are fetched once rather than on every run. The key names both
      # models: changing either must invalidate the cache, or the job silently
      # keeps scoring with the previous one.
      - name: Cache model weights (bge-m3 + bge-reranker-v2-m3)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf
          key: hf-${{ env.EMBED_LOCAL_MODEL }}-${{ env.RERANK_LOCAL_MODEL }}-${{ hashFiles('services/ai/uv.lock') }}

      - name: Install
        run: uv sync --extra dev --extra local-embed --frozen

      - name: Fetch model weights if not cached
        run: |
          uv run python - <<'PY'
          from huggingface_hub import snapshot_download
          for repo in ("BAAI/bge-m3", "BAAI/bge-reranker-v2-m3"):
              # The repos ship a full ONNX duplicate of the weights that nothing
              # here loads; excluding it roughly halves each download.
              print(repo, snapshot_download(repo, ignore_patterns=["onnx/*", "*.onnx"]))
          PY

      # No credential guard here: `eval-scope` already refused to arm the gate
      # without secrets, so reaching this step means they exist. Guarding again
      # would let a shard exit 0 having written nothing, which the merge step
      # would then report as a missing case rather than as "not configured".
      - name: Run eval shard
        run: uv run python -m octopus_ai.evaluation --shard ${{ matrix.shard }}/5 --out shard-${{ matrix.shard }}.json

      - name: Upload shard results
        uses: actions/upload-artifact@v4
        with:
          name: eval-shard-${{ matrix.shard }}
          path: services/ai/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  # Applies the thresholds, once, over the whole set. This is the job whose
  # red/green actually means something; the shards only gather evidence.
  eval-report:
    name: ai · retrieval eval (golden set)
    runs-on: ubuntu-latest
    needs: [eval-scope, eval]
    # `always()` so a failed or cancelled shard still reaches the merge, which
    # then refuses on missing cases and says exactly which ones. Without it the
    # gate would simply be skipped when a shard died, which reads as "fine".
    if: always() && needs.eval-scope.outputs.retrieval == 'true'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # No models and no credentials: merging is arithmetic over JSON. Skipping
      # the local-embed extra keeps this job at seconds rather than minutes.
      - name: Install
        run: uv sync --extra dev --frozen

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: eval-shard-*
          path: services/ai/shards
          merge-multiple: true

      - name: Merge shards and apply the gate
        run: |
          ls -l shards/ || true
          uv run python -m octopus_ai.evaluation --merge shards/*.json
