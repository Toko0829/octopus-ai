[project]
name = "octopus-ai"
version = "0.0.0"
description = "Octopus AI service: RAG and the agent reasoning core. Proposes; never writes."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "pytest-asyncio>=1.4.0",
]
# EMBED_PROVIDER=local only (ADR-0008). Deliberately an extra, not a base
# dependency: FlagEmbedding pulls torch and transformers, several GB that an
# OpenAI-backed deployment and every CI run would otherwise carry for nothing.
# Install with: uv sync --extra local-embed
#
# torch is listed here even though FlagEmbedding already depends on it, because
# `tool.uv.sources` below only binds a DIRECT dependency. Naming it is what makes
# the CPU index apply; without this line the resolver takes the default PyPI
# wheel and the CUDA stack comes with it.
local-embed = [
    "FlagEmbedding>=1.3",
    "torch",
]

# CPU-only torch, everywhere.
#
# Measured from the previous lockfile: `nvidia-*` plus `triton` came to **2,480 MB
# of the 3,179 MB** of Linux wheels, so 78% of the dependency payload was GPU code
# that nothing here can execute. No environment this project runs in has a GPU.
# CI runners are CPU, the Fly.io target is CPU, and `config.py` already notes that
# fp16 is meaningless on CPU-only hosts, where the local models fall back to fp32.
#
# Pinned for local, CI and the container alike rather than only inside the image.
# Overriding it in the Dockerfile would be smaller today and would mean CI scored
# the golden set on one torch build while production ran another, with nothing
# detecting the divergence. ADR-0009 records that a torch or transformers bump
# moves model scores, which is why `uv.lock` is in the eval's trigger paths: this
# is a change the gate is supposed to re-measure, not one to route around.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/octopus_ai"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, comprehensions, pyupgrade
select = ["E", "F", "I", "B", "C4", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# `auto` so async tests need no per-test marker; every async test here is a
# plain coroutine and the marker would be pure ceremony.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
