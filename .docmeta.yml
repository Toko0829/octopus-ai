# .docmeta.yml — documentation registry
#
# Maps code paths (globs) to their OWNING module doc. CI reads this file and FAILS any PR
# that modifies a mapped code path without also modifying its owning doc. This is the
# machine-enforced half of the doc-maintenance rule (see AGENTS.md and README §9).
#
# Rules:
#   - Every code path under apps/** and packages/** MUST match at least one entry.
#   - `owner` is the module doc that must change when the code changes.
#   - `also_touch` lists docs that frequently must change together (advisory, not enforced).
#   - A PR touching schema/RLS also touches docs/10-architecture/data-model.md.
#   - Mappings may be FORWARD-REGISTERED for paths that do not exist yet (apps/matcher,
#     packages/core, and so on). That is deliberate: the gate then fires the moment that
#     code first lands. Do not prune an entry merely because its directory is absent.
#     Prune only when a path is genuinely superseded, as `packages/rag/**` was by ADR-0006.

version: 1

# When any of these change, the master README must be reviewed (scope/stack/core-loop/module-map).
readme_triggers:
  - 'package.json' # dependency/stack change
  - 'packages/contracts/**' # contract/scope change
  - 'apps/**/src/routes/**' # public API surface

mappings:
  # **More specific than `apps/web/**` and listed before it**, because the ops
  # console is not a workspace surface: it renders other people's money to
  # somebody who is party to none of it, and its owning doc is admin-ops.md
  # rather than the design-system pair. The design docs stay on `also_touch`
  # because it is still the first Dark Command Deck surface in the repository.
  - path: 'apps/web/app/ops/**'
    owner: 'docs/30-modules/admin-ops.md'
    also_touch: ['docs/20-design/design-system.md']

  - path: 'apps/web/**'
    owner: 'docs/30-modules/design-system-frontend.md'
    also_touch: ['docs/30-modules/chat-discord.md', 'docs/20-design/design-system.md']

  # The ops routes and the role check that guards them, ahead of the general
  # `apps/api/**` entry for the same reason the web one is. `require-ops.ts` is
  # the first authorisation in this system that reads `profiles.role`, so
  # auth-identity.md is an owner here rather than a courtesy touch.
  - path: 'apps/api/src/routes/ops.ts'
    owner: 'docs/30-modules/admin-ops.md'
    also_touch: ['docs/30-modules/payments-billing.md']

  - path: 'apps/api/src/plugins/require-ops.ts'
    owner: 'docs/30-modules/admin-ops.md'
    also_touch: ['docs/30-modules/auth-identity.md']

  - path: 'apps/api/**'
    owner: 'docs/10-architecture/architecture.md'
    also_touch: ['docs/30-modules/auth-identity.md']

  # `apps/matcher/**` was forward-registered from Phase 0 and is deliberately
  # gone. ADR-0010 put durable work on the Postgres we already have, so the
  # matcher shipped in slice 4 as a sweep on the `apps/api` ticker with its pure
  # half in `packages/marketplace`. Both paths are mapped below and above; a
  # third mapping for a service nobody is going to build is the forward
  # registration outliving the decision that made it wrong.

  - path: 'apps/agent/**'
    owner: 'docs/30-modules/ai-orchestrator.md'
    also_touch: ['docs/30-modules/business-projects-workflow.md']

  - path: 'packages/db/migrations/**'
    owner: 'docs/10-architecture/data-model.md'
    also_touch: ['docs/10-architecture/security-compliance.md']

  # `packages/rag/**` was the pre-ADR-0006 home for retrieval. It never existed
  # on disk and the AI layer is Python now, so that mapping could never fire.
  # RAG lives under `services/ai/**` below, which carries the same owning docs.

  # Python AI service (RAG + agent reasoning + eval + models) — see ADR-0006.
  - path: 'services/ai/**'
    owner: 'docs/30-modules/ai-orchestrator.md'
    also_touch:
      [
        'docs/10-architecture/rag.md',
        'docs/30-modules/rag-knowledge.md',
        'docs/10-architecture/tech-stack.md',
        'docs/10-architecture/learning-flywheel.md',
      ]

  - path: 'packages/marketing/**'
    owner: 'docs/30-modules/marketing-growth-engine.md'
    also_touch:
      ['docs/10-architecture/learning-flywheel.md', 'docs/60-playbooks/full-funnel-creator.md']

  # The marketplace's pure domain logic: the skill taxonomy, the verification
  # seam and its registry, eligibility, and since slice 4 the stage-to-skill map,
  # jurisdiction containment (ADR-0015) and the matcher's ranking. The sweep that
  # uses them is `apps/api/src/lib/match.ts`, covered by the `apps/api/**`
  # mapping above.
  - path: 'packages/marketplace/**'
    owner: 'docs/30-modules/human-nodes-marketplace.md'
    also_touch: ['docs/10-architecture/security-compliance.md']

  # Money as arithmetic somebody can check, and no money at all: the chart of
  # accounts, the balanced double-entry pairs, the derived idempotency keys, and
  # the payment provider seam with its registry (whose `carriesRealMoney` flag is
  # the enforced half of the counsel gate).
  #
  # **Owned by payments-billing.md rather than by business-projects-workflow.md**,
  # and the difference is why this package exists at its own path. That doc's
  # owner-paths line said the ledger would live in `packages/core`, which is
  # mapped below to the workflow doc: a ledger there would have been doc-mapped to
  # the wrong module by construction, so every change to the chart of accounts
  # would have been obliged to edit the workflow doc and free to leave the
  # payments doc untouched. The spec was reconciled in place instead, which is the
  # `credentials -> node_credentials` precedent.
  - path: 'packages/payments/**'
    owner: 'docs/30-modules/payments-billing.md'
    also_touch:
      ['docs/10-architecture/data-model.md', 'docs/10-architecture/security-compliance.md']

  - path: 'packages/agent-tools/**'
    owner: 'docs/30-modules/ai-orchestrator.md'

  - path: 'packages/contracts/**'
    owner: 'docs/10-architecture/architecture.md'

  - path: 'packages/core/**'
    owner: 'docs/30-modules/business-projects-workflow.md'

  - path: 'packages/realtime/**'
    owner: 'docs/30-modules/chat-discord.md'

  - path: 'packages/ui/**'
    owner: 'docs/30-modules/design-system-frontend.md'
    also_touch: ['docs/20-design/design-system.md']

  - path: 'packages/observability/**'
    owner: 'docs/30-modules/infra-devops.md'
    also_touch: ['docs/10-architecture/observability.md']

  # This file's own rule at the top says every path under packages/** must match
  # an entry, and this one never did, so the env schema (which is where a new
  # service knob is declared, and therefore where a deployment-shaped decision is
  # actually recorded) could change with no doc anywhere obliged to notice.
  - path: 'packages/config/**'
    owner: 'docs/30-modules/infra-devops.md'

  - path: 'supabase/migrations/**'
    owner: 'docs/10-architecture/data-model.md'

  - path: 'supabase/functions/**'
    owner: 'docs/30-modules/integrations.md'

  - path: '.github/workflows/**'
    owner: 'docs/30-modules/infra-devops.md'

  # The root compose file, which had no mapping at all until a change to it went
  # unnoticed by every doc: how the stack is run is a deployment-shaped decision
  # and belongs to the infra doc, exactly like the workflows above it.
  #
  # Deliberately only the compose file, not the three Dockerfiles. Two of them sit
  # under `apps/**`, which is already owned, and because this checker tests every
  # mapping independently, a glob covering them would demand an edit to two docs
  # for one Dockerfile line. `services/ai/Dockerfile` is likewise already carried
  # by the `services/ai/**` entry.
  - path: 'docker-compose.yml'
    owner: 'docs/30-modules/infra-devops.md'

  # Developer instruments that read the corpus and the eval's own output. Owned by
  # the RAG module doc rather than by infra: `rag-lens` parses the funnel-stage
  # coverage table out of that doc instead of keeping its own copy, so a change to
  # the tool and a change to the table are the same review.
  #
  # Scoped to `tools/rag-lens/**`, not `tools/**`. It was the broader glob until
  # `tools/art` arrived, and because this checker tests every mapping independently,
  # a wildcard here would have demanded an edit to the RAG doc every time somebody
  # re-lit the landing hero.
  - path: 'tools/rag-lens/**'
    owner: 'docs/30-modules/rag-knowledge.md'
    also_touch: ['docs/10-architecture/rag.md']

  # The Blender scene that renders the landing art. Owned by the frontend module doc
  # because the thing it produces is a shipped asset in `apps/web/public`, and the
  # exposure it renders at is an accessibility decision argued out in that doc.
  - path: 'tools/art/**'
    owner: 'docs/30-modules/design-system-frontend.md'
    also_touch: ['docs/20-design/design-system.md']

# Domain areas without a single code root — reviewers verify these manually.
manual_review:
  # Kept, and narrowed by slice 5. `packages/payments/**` is mapped above and is
  # enforced; what stays manual is the money code with no single root: the escrow
  # and ledger writes inside `supabase/migrations/**`, the accept path in
  # `apps/api/**`, and any future Stripe webhook.
  - area: 'payments / escrow / ledger outside packages/payments'
    owner: 'docs/30-modules/payments-billing.md'
  - area: 'notifications fan-out'
    owner: 'docs/30-modules/notifications.md'
  # **Narrowed by slice 8.** The dispute console is real code now and is mapped
  # above, so it is enforced rather than reviewed. What stays manual is the six
  # consoles admin-ops.md still specifies and nothing has built: moderation, node
  # ops, payments reconciliation, task-queue ops, RAG source ops and the
  # audit-trail explorer.
  - area: 'admin / ops consoles other than disputes'
    owner: 'docs/30-modules/admin-ops.md'
  - area: 'analytics / metrics'
    owner: 'docs/30-modules/analytics.md'
